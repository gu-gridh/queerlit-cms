{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <div class="title"><h1>{{ page.title }}</h1></div>
    <div class="container">
    {{ page.intro|richtext }}
        <form action="{% pageurl page %}" method="POST">
            {% csrf_token %}
            {% for field in form %}
            <p class="field">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}{% if field.field.required %}<span class="mark-in-red"> *</span>{% endif %}
                </label>
                {{ field }}
                {% if field.help_text %}<p>{{ field.help_text }}</p>{% endif %}
                {{ field.errors }}
            </p>
            {% endfor %}
            <input type="submit">
        </form>
    </div>
{% endblock %}
